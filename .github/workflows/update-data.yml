name: Update data

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小時（UTC）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data
        timeout-minutes: 15
        continue-on-error: true   # 即使抓取被終止，已保存的數據仍會提交和部署
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          GDELT_BUDGET: "180"     # GDELT 最多用 3 分鐘
        run: python scripts/fetch_all.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "數據沒有變化"
            exit 0
          fi
          git commit -m "data: update $(date -u '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "推送失敗" && exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
